version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: raizdonordeste_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raiz_user
      POSTGRES_PASSWORD: raiz_pass
      POSTGRES_DB: raizdonordeste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiz_user -d raizdonordeste"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raizdonordeste_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://raiz_user:raiz_pass@postgres:5432/raizdonordeste?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
